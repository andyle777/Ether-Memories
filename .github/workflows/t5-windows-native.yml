name: T5 Windows Native Reconciliation

on:
  push:
    branches:
      - feat/v0.7.0-t5-windows-final-pass
      - release/v0.7.0-t6-final-freeze
  workflow_dispatch:

jobs:
  native-windows:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Native environment and exact checkout
        shell: pwsh
        run: |
          node --version
          npm --version
          git rev-parse HEAD
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsBuildNumber
      - run: npm ci
      - name: Toolchain security baseline
        run: npm run verify:toolchain
      - run: npm run typecheck
      - run: npm run build
      - name: Production capability, strict refusal and T4 overlap
        run: npm test -- tests/windows-recoverable.test.ts tests/windows-recoverable-integration.test.ts
      - name: Proof negative controls must reject missing native evidence
        run: node scripts/t5-windows-proof-negative-controls.mjs
      - name: Native filesystem and identity probe
        run: node scripts/round11-windows-native-probe.mjs
      - name: Six synchronized process-termination scenarios
        run: node scripts/round11-windows-crash-probe.mjs
      - name: Verify test and crash workers exited
        run: npm run verify:workers
      - name: Preserve mandatory native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t5-native-node-${{ matrix.node }}-${{ github.sha }}
          path: round11-report-*.json
          if-no-files-found: error
